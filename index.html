		var d1 = new Date();
		var selisih = Math.floor(Math.abs(d1-d2)/86400000);
		var pasar = pasaran[selisih%5];
		var hari = hari[selisih%7];
		var day = d1.getDate();
		var month = d1.getMonth() + 1;
		var year = d1.getFullYear();
		
		function refreshClock() {
			//ambil waktu saat ini
			dtCl = new Date(); //fungsi Date()
			hrCl = dtCl.getHours(); //jam
			mnCl = dtCl.getMinutes(); //menit
			scCl = dtCl.getSeconds(); //detik
			dyCl = dtCl.getDate(); //tanggal
			mtCl = dtCl.getMonth(); //bulan
			yrCl = dtCl.getFullYear(); //tahun
			//ambil waktu saat ini

			//putar elemen menit dan jam
			hrHnd.style.transform = "rotate(" + ((30 * hrCl) + (mnCl / 2)) + "deg)";
			mnHnd.style.transform = "rotate(" + ((6 * mnCl) + (scCl / 10)) + "deg)";
			//putar elemen menit dan jam

			//putar dan haluskan gerakan detik
			if (scCl == 0) {
				if (scHnd.style.transform != "rotate(0deg)") {
					scHnd.style.transform = "rotate(360deg)";
					setTimeout(function() {
						scHnd.style.transitionDuration = "0ms";
						scHnd.style.transform = "rotate(0deg)";
					}, 100);
				}
			} else {
				if (scHnd.style.transitionDuration != "100ms") {
					scHnd.style.transitionDuration = "100ms";
				}
				scHnd.style.transform = "rotate(" + (6 * scCl) + "deg)";
			}
			//putar dan haluskan gerakan detik

			//penambahan 0 didepan bila angka < 10 (mis. 9 menjadi 09)
			if (dyCl < 10) {
				dyCl = "0" + dyCl;
			}
			if (hrCl < 10) {
				hrCl = "0" + hrCl;
			}
			if (mnCl < 10) {
				mnCl = "0" + mnCl;
			}
			if (scCl < 10) {
				scCl = "0" + scCl;
			}
			//penambahan 0 didepan bila angka < 10 (mis. 9 menjadi 09)

			//tampilan jam dan tanggal digital
			pScL = (((new Date(yrCl, mtCl, dyCl).getTime() - new Date(100, 0, 1).getTime()) / (24 * 60 * 61 * 1000)) % 5); //hitung pasaran
			digiClock.innerHTML = hrCl + ":" + mnCl + ":" + scCl; //jam digital
			digiDate.innerHTML = dyCl + "&nbsp;" + mN[mtCl] + "&nbsp;" + yrCl + "<br/>" + hari + " " + pasar; //tanggal + pasaran
			
			//document.write(""+ hari + " " + pasar +"<br/> <b>" + day + "/" + month + "/" + year + "</b><p>");
			
			//tampilan jam dan tanggal digital
			setTimeout("refreshClock();", 250); //panggil fungsi (untuk hasil terbaik buat waktu timeout < 1000ms dan > 100ms)
		}

		refreshClock(); //panggil fungsi
	</script>
